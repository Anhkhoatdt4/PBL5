<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử đơn hàng</title>
    <link rel="stylesheet" href="history.css"> <!-- Liên kết với file CSS của bạn -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script> <!-- Liên kết với Font Awesome để sử dụng biểu tượng đơn hàng -->
</head>

<body>
    <!-- Thanh Header -->
    <header>
        <div class="logo-container">
            <div class="logo">
                <img src="image/logo.png" alt="Logo">
                <h1>BKN Fruits</h1>
            </div>
        </div>
        <nav>
            <a href="home.html" class="nav-link">🏠 Trang chủ</a>
        </nav>
    </header>

    <main class="search-history-content">
        <h2>Tra cứu lịch sử đơn hàng</h2>

        <form onsubmit="event.preventDefault(); fetchOrders();" class="search-form">
            <div class="form-group">
                <label for="username">Tên người dùng:</label>
                <input type="text" id="username" name="username" required placeholder="Nhập tên người dùng">
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại:</label>
                <input type="text" id="phone" name="phone" required placeholder="Nhập số điện thoại">
            </div>

            <button type="submit">Tìm kiếm</button>
        </form>

        <div id="orderContainer" class="order-grid"></div>

        </div>

        <div id="overlay" class="overlay"></div>

        <!-- Modal để hiển thị chi tiết đơn hàng -->
        <div id="orderDetailModal" class="order-detail-modal"></div>
    </main>

    <footer>
        <p>&copy; 2025 BKN Fruits</p>
    </footer>
    <script>
        async function fetchOrders() {
            const username = document.getElementById("username").value;
            const phoneNumber = document.getElementById("phone").value;
            console.log(username + " , " + phoneNumber);
            const url = "http://localhost:8080/api/orders/search";
            const response = await fetch(`${url}?username=${encodeURIComponent(username)}&phoneNumber=${encodeURIComponent(phoneNumber)}`);
            const orders = await response.json();
            console.log("orders : ", orders);

            renderOrders(orders);

            function renderOrders(orders) {
                const container = document.getElementById("orderContainer");
                container.innerHTML = "";

                if (orders.length === 0) {
                    container.innerHTML = "<p>Không có đơn hàng nào!</p>";
                    return;
                }

                // Mảng 3 url ảnh đại diện đơn hàng
                const orderImages = [
                    "https://i.pinimg.com/736x/6f/c5/a8/6fc5a86eae222c89362d40541b328d87.jpg",
                    "https://i.pinimg.com/736x/71/69/7f/71697f46779c548c8b2c00bfe1c9d1b6.jpg",
                    "https://i.pinimg.com/736x/5a/a6/62/5aa6627eab1de39f4187fc0eda506b02.jpg"
                ];
                orders.forEach((order, index) => {
                    const orderDiv = document.createElement("div");
                    orderDiv.classList.add("order-item");
                    orderDiv.style.border = "width: 80%";
                    const detailId = `details-${order.id}`;
                    // Đánh số thứ tự hiển thị từ 001, 002, ...
                    const displayOrderNumber = (index + 1).toString().padStart(3, '0');
                    // Lấy ảnh theo thứ tự, lặp lại nếu nhiều hơn 3 đơn hàng
                    const orderImgUrl = orderImages[index % orderImages.length];
                    orderDiv.innerHTML = `
                    <div style="display: flex; align-items: center; margin-bottom: 10px;">
                        <div style="flex-shrink:0;margin-left: 20px ; margin-right: 18px; display: flex; align-items: center; justify-content: center;">
                            <img src="${orderImgUrl}" class="order-avatar" alt="Order Avatar">
                        </div>
                        <div style="flex:1;">
                            <h3 style="margin-bottom: 6px;">Đơn hàng #${displayOrderNumber}</h3>
                            <p>Ngày đặt: ${new Date(order.createdAt).toLocaleDateString()}</p>
                            <p style="font-weight:bold;">Tổng tiền: ${order.totalPrice.toLocaleString()} đ</p>
                            <button onclick="toggleDetails('${detailId}', '${encodeURIComponent(JSON.stringify(order.items))}')">Xem chi tiết</button>
                            <div id="${detailId}" style="display:none; margin-top: 10px;"></div>
                        </div>
                    </div>
                `;

                    container.appendChild(orderDiv);
                });
            }
        }

        function toggleDetails(detailId, itemsJSON) {
            console.log("Toggle Details called for ID:", detailId);
            console.log("Items JSON received:", itemsJSON); // Log the received JSON

            const overlay = document.getElementById("overlay");
            const modal = document.getElementById("orderDetailModal");

            overlay.addEventListener("click", function () {
                modal.style.display = "none";
                overlay.style.display = "none";
            });


            if (modal.style.display === "none") {
                try {
                    const items = JSON.parse(decodeURIComponent(itemsJSON)); // Decode and parse the JSON string back to an object
                    console.log("Parsed items:", items); // Log the parsed items

                    let html = items.map(item => `
                    <div class="order-detail-card">
                        <img src="${item.imageUrl}" alt="${item.fruitName}" class="order-image" />
                        <div class="order-info">
                            <h3 class="order-name">${item.fruitName}</h3>
                            <p class="order-weight">Khối lượng: ${item.weight} kg</p>
                            <p class="order-price">Đơn giá: ${item.pricePerKg.toLocaleString()} đ/kg</p>
                            <p class="order-total">Thành tiền: ${item.totalPrice.toLocaleString()} đ</p>
                        </div>
                    </div>
                `).join("");

                    modal.innerHTML = html;
                    modal.style.display = "block";
                    overlay.style.display = "block";

                } catch (error) {
                    console.error("Error parsing items:", error); // Log parsing error
                    modal.innerHTML = "<p>Không thể hiển thị chi tiết đơn hàng.</p>";
                }
            } else {
                modal.style.display = "none";
                overlay.style.display = "none";
            }
        }
    </script>
</body>

</html>
