<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="main-content">
        <div class="dashboard">
            <h2>Thống kê tổng quan</h2>
            <div class="stat-box">
                <div class="stat-card green">
                    <i class="fa-solid fa-tag"></i>
                    <p><strong id="stat-products">...</strong> Sản phẩm</p>
                </div>
                <div class="stat-card blue">
                    <i class="fa-solid fa-box"></i>
                    <p><strong id="stat-orders">...</strong> Đơn hàng</p>
                </div>
                <div class="stat-card orange">
                    <i class="fa-solid fa-money-bill-1"></i>
                    <p><strong id="stat-revenue">...</strong> Thu nhập</p>
                </div>
                <div class="stat-card red">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <p><strong id="stat-outofstock">...</strong> Hết hàng</p>
                </div>
            </div>
        </div>
        
        <div class="table-container">
            <h2>Sản phẩm bán chạy</h2>
            <table>
                <thead>
                    <tr>
                        <th>Mã sản phẩm</th>
                        <th>Tên sản phẩm</th>
                        <th>Giá/kg</th>
                        <th>Danh mục</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>e759165d-4ff0-426c-a289-5b2e5604aec4</td>
                        <td>Apples</td>
                        <td>35.000đ</td>
                        <td>Sản phẩm</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="chart-container">
             <div style="flex: 1; display: flex; flex-direction: row;">
                <div class="chart-box">
                <h2>Biểu đồ doanh số</h2>
                <canvas id="chart1"></canvas>
                </div>
                <div class="chart-box">
                    <h2>Thống kê đơn hàng</h2>
                    <canvas id="chart2" style="margin-left: 200px;"></canvas>
                </div>

             </div>
            
             <div style="flex: 1; display: flex; flex-direction: row;">
                <div class="chart-box">
                    <h2>Biểu đồ đơn hàng</h2>
                    <canvas id="chart3"></canvas>
                </div>
                <div class="chart-box">
                    <h2>Biểu đồ hàng tồn kho</h2>
                    <canvas id="chart4"></canvas>
                </div>
            </div>    
        </div>
    </div>
    

</body>
</html>
