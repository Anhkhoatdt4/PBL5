<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý tồn kho</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="product_ad.css">
</head>

<body>
    <div class="main-content">
        <header class="header-categories">
            <h2>Quản lý tồn kho</h2>
        </header>

        <div class="top-bar">
            <div class="actions">
                <button class="add-btn bt-hover" style="    margin-left: -1px;
                        background:  linear-gradient(90deg, #ff6a88 0%, #6f42c1 100%);
                        border: rgb(157, 200, 249);
                        color: white;
                        padding: 17px;
                        border-radius: 8px">
                <i class="fa-solid fa-plus"></i> Thêm sản phẩm</button>
                <button id="export-bestseller-excel" class="export-btn"><i
                        class="fa-solid fa-file-export"></i> Xuất dữ liệu</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Tìm kiếm sản phẩm...">
                <i class="fa-solid fa-search"></i>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên sản phẩm</th>
                    <th>Giá/kg</th>
                    <th>Số lượng (kg)</th>
                    <th style="width: 26%;">Hành động</th>
                </tr>
            </thead>
            <tbody id="productTable">

            </tbody>

        </table>

        <div id="addStockModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal()">&times;</span>
                <h2 id="modalTitle" style="margin: 20px;">Cập nhật tồn kho</h2>

                <div>
                    <img id="productImage" src="" alt="Ảnh sản phẩm"
                        style="max-width: 250px; max-height: 250px; margin-left: 80px;" />
                </div>

                <form id="addStockForm">
                    <div>
                        <label id="amountLabel" for="amount">Số lượng cần thêm (kg):</label>
                        <input type="number" id="amount" placeholder="Nhập số lượng" required min="1">
                    </div>

                    <div id="priceInputContainer" style="display: none;">
                        <label for="price">Giá mới (VND/kg):</label>
                        <input type="number" id="price" placeholder="Nhập giá" min="0">
                    </div>

                    <div class="form-actions">
                        <button type="submit">Lưu</button>
                        <button type="button" onclick="closeModal()">Hủy</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script src="product_ad.js"></script>
  </body>
</html>
