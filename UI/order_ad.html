<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Đơn hàng</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
    />
    <link rel="stylesheet" href="order_ad.css" />
  </head>
  <body>
    <div class="main-content">
      <div class="header-categories">
        <h2>Quản lý Đơn hàng</h2>
        <div class="top-bar-actions">
          <button class="export-btn">
            <i class="fa-solid fa-file-export"></i> Xuất dữ liệu
          </button>
        </div>
      </div>

      <div class="top-bar">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input
            type="text"
            id="searchInput"
            placeholder="Tìm kiếm đơn hàng..."
          />
        </div>
        <div class="date-filter">
          <i class="fa-solid fa-calendar-days"></i>
          <input
            type="date"
            id="dateFilter"
            title="Chọn ngày để lọc đơn hàng"
          />
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Số thứ tự</th>
            <th>Tổng tiền</th>
            <th id="timeHeader">Thời gian <span id="sortIcon">⬇️</span></th>
            <th>Trạng thái</th>
            <th>Chỉnh sửa</th>
            <th>Xem</th>
          </tr>
        </thead>
        <tbody id="productTable"></tbody>
      </table>
    </div>

    <div id="orderModal" class="modal">
      <div class="modal-content">
        <img class="modal-img" src="https://i.pinimg.com/736x/fc/18/29/fc182965fbbe9e50e66fa19da023ca0a.jpg" alt="Order Image" />
        <span class="close" id="closeOrderModal">&times;</span>
        <h2>Chỉnh sửa đơn hàng</h2>
        <form id="orderEditForm">
          <div>
            <label>Mã đơn hàng:</label>
            <input type="text" id="modalOrderId" readonly />
          </div>
          <div>
            <label>Tổng tiền:</label>
            <input type="text" id="modalOrderTotal" readonly />
          </div>
          <div>
            <label>Ngày tạo:</label>
            <input type="text" id="modalOrderDate" readonly />
          </div>
          <div>
            <label>Trạng thái:</label>
            <select id="modalOrderStatus">
              <option value="PENDING">PENDING</option>
              <option value="PAID">PAID</option>
              <option value="CANCELLED">CANCELLED</option>
              <option value="FAILED">FAILED</option>
            </select>
          </div>
          <div class="form-actions">
            <button type="button" id="closeModalBtn">Đóng</button>
            <button type="submit">Lưu thay đổi</button>
          </div>
        </form>
      </div>
    </div>

    <script src="order_ad.js"></script>
  </body>
</html>
