<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Đơn hàng</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="order_ad.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

</head>
<style>
        td {
        vertical-align: middle;
        text-align: center;
    }

    .edit-btn-id , .view-btn-id {
        display: flex;
        justify-content: center;
    }

    .edit-btn, .view-btn {
        padding: 6px 10px;
        border: none;
        background-color: #0049cf;
        border-radius: 4px;
        cursor: pointer;
    }

    .edit-btn i, .view-btn i {
        font-size: 16px;
    }
    .view-btn {
        margin-left:  89px;
        margin-right: 87px;
    }
</style>
<body>
    <div class="main-content">
        <header class="header-categories">
            <h2>Quản lý Đơn hàng</h2>
        </header>
        
        <div class="top-bar">
            <div class="actions">
                <button class="export-btn" style="background-color: #efcaca; border: #efcaca; color: #bf0000;"><i class="fa-solid fa-file-export"></i> Xuất dữ liệu</button>
            </div>
            <div class="search-box" style="margin-right: 20px;">
                <input type="text" id="searchInput" placeholder="Tìm kiếm đơn hàng...">
                <i class="fa-solid fa-search"></i>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 35%;">ID đơn hàng</th>
                    <th style="width: 20%;">Tổng tiền</th>
                    <th style="width: 20%;">Trạng thái</th>
                    <th style="width: 20%;">Edit</th>
                    <th style="width: 20%;">View</th>
                </tr>
            </thead>
            <tbody id="productTable">
            </tbody>
        </table>
    </div>
    <!-- <script src="export_utils.js" defer></script> -->
    <script src="order_ad.js" defer></script>
</body>
</html>
