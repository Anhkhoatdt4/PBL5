<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div class ="background">
        <img src = "image/back.png">
    </div>
    <div class="container">
        <div class="left-section">
            <img src="image/image_signup.jpg">
        </div>
        <div class="right-section">
            <h2>Hello!<br>We are glad to see you :)</h2>
            <button class="google-btn">Sign up with Google</button>
            <div class="social-icons">
                <a href="#" class="social-icon"><img src="image/facebook.png"></a>
                <a href="#" class="social-icon"><img src="image/ig.jpeg"></a>
            </div>
            <p class="or-text">Or</p>
            <form>
                <div class="form-group">
                    <input type="text" placeholder="Name">
                    <input type="email" placeholder="Email Address">
                </div>
                <div class="form-group">
                    <input type="password" placeholder="Password">
                    <input type="password" placeholder="Repeat Password">
                </div>
                <div class="terms">
                    <input type="checkbox" id="terms">
                    <label for="terms">I agree <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                </div>
                <button type="submit" class="signup-btn">Sign Up</button>
            </form>
            <p class="login-text">Bạn đã có tài khoản? <a href="login.html" class="login-btn">Đăng nhập</a></p>
        </div>
    </div>
</body>
</html>
